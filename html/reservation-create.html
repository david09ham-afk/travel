<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="여행 숙소 예약 요청을 작성합니다.">
  <title>예약 요청 | 여행의 온도</title>
  <link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/account.css">
  <script type="module" src="../js/reservation-create.js"></script>
</head>
<body class="flow-page">
  <header class="flow-header"><a class="brand" href="../index.html"><span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span><span>여행의 온도</span></a><a href="reservations.html">내 예약</a></header>
  <main class="flow-main">
    <a class="back-link" href="../index.html">← 메인으로</a>
    <p class="eyebrow">YOUR NEXT STAY</p><h1>예약 요청</h1>
    <p class="flow-intro">요청을 보내면 관리자가 숙소 가용성을 확인한 뒤 확정합니다.</p>
    <form class="flow-form" id="reservation-form">
      <label>숙소<select name="stayId" id="stay-select" required><option value="">숙소 정보를 불러오는 중입니다</option></select></label>
      <div class="form-columns"><label>체크인<input type="date" name="checkIn" required></label><label>체크아웃<input type="date" name="checkOut" required></label></div>
      <label>예약 인원<select name="guestCount" required><option value="1">1명</option><option value="2" selected>2명</option><option value="3">3명</option><option value="4">4명</option><option value="5">5명</option><option value="6">6명</option></select></label>
      <p class="flow-status" id="reservation-status" aria-live="polite"></p>
      <button class="form-submit" type="submit">예약 요청하기</button>
    </form>
  </main>
</body>
</html>
